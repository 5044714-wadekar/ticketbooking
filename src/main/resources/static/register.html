<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Register - MovieBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">
<div class="container mt-5" style="max-width: 400px;">
    <div class="card p-4 shadow">
        <h3 class="text-center mb-3">MovieBook</h3>
        <h5 class="text-center text-muted mb-4">Register</h5>
        
        <div id="msg"></div>
        
        <input class="form-control mb-2" id="regName" placeholder="Full Name">
        <input class="form-control mb-2" id="regEmail" placeholder="Email" type="email">
        <input class="form-control mb-3" id="regPassword" type="password" placeholder="Password">
        
        <button class="btn btn-success w-100" onclick="doRegister()">Register</button>
        
        <hr>
        <p class="text-center mb-0">
            Already have account? <a href="login.html">Login here</a>
        </p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
