<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Payment - MovieBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
<nav class="navbar navbar-dark bg-dark px-3">
    <a href="index.html" class="navbar-brand">MovieBook</a>
</nav>

<div class="container mt-5" style="max-width: 500px;">
    <div class="card p-4 text-dark">
        <h3 class="text-center mb-4">💳 Payment</h3>
        
        <div class="alert alert-info">
            <strong>Booking Summary</strong>
            <hr>
            <p class="mb-1"><strong>Movie:</strong> <span id="payMovie"></span></p>
            <p class="mb-1"><strong>Seats:</strong> <span id="paySeats"></span></p>
            <p class="mb-0"><strong>Amount:</strong> ₹<span id="payAmount"></span></p>
        </div>
        
        <h5>Select Payment Method</h5>
        <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="payMethod" id="upi" checked>
            <label class="form-check-label" for="upi">UPI (GPay / PhonePe / Paytm)</label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="payMethod" id="card">
            <label class="form-check-label" for="card">Credit / Debit Card</label>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="radio" name="payMethod" id="netbanking">
            <label class="form-check-label" for="netbanking">Net Banking</label>
        </div>
        
        <div id="payMsg"></div>
        
        <button class="btn btn-success w-100" id="payBtn" onclick="processPayment()">Pay ₹<span id="payBtnAmt"></span></button>
        
        <p class="text-center text-muted mt-3 mb-0">
            <small>⚠️ Demo payment — only for understanding</small>
        </p>
    </div>
</div>

<script src="script.js"></script>
<script>initPayment();</script>
</body>
</html>
