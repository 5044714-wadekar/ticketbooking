<!DOCTYPE html>
<html>
<head>
    <title>Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">🎬 Admin Panel</span>
    <button class="btn btn-sm btn-danger" onclick="logout()">Logout</button>
</nav>
<div class="container mt-4">
    <h3>Add Movie</h3>
    <div class="row g-2 mb-4">
        <div class="col-md-3"><input class="form-control" id="mTitle" placeholder="Title"></div>
        <div class="col-md-3"><input class="form-control" id="mPoster" placeholder="Poster URL"></div>
        <div class="col-md-2"><input class="form-control" id="mTime" placeholder="Show Time"></div>
        <div class="col-md-2"><input class="form-control" id="mPrice" type="number" placeholder="Price"></div>
        <div class="col-md-2"><button class="btn btn-success w-100" onclick="addMovie()">Add</button></div>
    </div>

    <h3>All Movies</h3>
    <table class="table table-bordered">
        <thead><tr><th>ID</th><th>Title</th><th>Time</th><th>Price</th><th>Action</th></tr></thead>
        <tbody id="adminMovieList"></tbody>
    </table>
</div>
<script src="script.js"></script>
<script>loadAdminMovies();</script>
</body>
</html>
