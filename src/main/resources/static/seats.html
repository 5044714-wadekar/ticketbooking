<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Select Seats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">
<nav class="navbar navbar-dark bg-dark px-3">
    <a href="theaters.html" class="navbar-brand">MovieBook</a>
    <div id="navRight"></div>
</nav>

<div class="container mt-4 text-center">
    <h2 id="movieTitle"></h2>
    <p>Price per seat: ₹<span id="priceTag"></span></p>
    
    <div class="legend mb-3">
        <span class="legend-item"><span class="seat-box available"></span> Available</span>
        <span class="legend-item"><span class="seat-box selected-box"></span> Selected</span>
        <span class="legend-item"><span class="seat-box booked"></span> Booked</span>
    </div>
    
    <div class="screen">SCREEN</div>
    <div id="seatGrid" class="seat-grid mt-4"></div>
    <h4 class="mt-3">Selected: <span id="selectedCount">0</span> | Total: ₹<span id="total">0</span></h4>
    <button class="btn btn-success mt-3" onclick="proceedToPayment()">Proceed to Payment</button>
</div>

<script src="script.js"></script>
<script>initSeats();</script>
</body>
</html>
