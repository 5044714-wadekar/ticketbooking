<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Select Theater - MovieBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <a href="theaters.html" class="navbar-brand">MovieBook</a>
    <div id="navRight"></div>
</nav>

<div class="container mt-4">
    <h2 class="text-center mb-4">Select Theater 🎭</h2>
    <p class="text-center text-muted">City: Pune</p>
    <div class="row" id="theaterList"></div>
</div>

<script src="script.js"></script>
<script>
    // Direct function call with error handling
    window.addEventListener('load', function() {
        console.log('Page loaded, calling loadTheaters');
        if (typeof loadTheaters === 'function') {
            loadTheaters();
        } else {
            console.error('loadTheaters is not a function!');
            document.getElementById('theaterList').innerHTML = 
                '<div class="alert alert-danger">loadTheaters function not found. Check script.js</div>';
        }
    });
</script>
</body>
</html>
