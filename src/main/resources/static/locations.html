<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Select City - MovieBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
        }
        .page-title {
            color: white;
            font-size: 42px;
            font-weight: 700;
            text-align: center;
            margin-top: 40px;
        }
        .page-subtitle {
            color: #cccccc;
            text-align: center;
            font-size: 18px;
            margin-bottom: 50px;
        }
        .city-card {
            background: #6a0dad;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            padding: 60px 40px;
            text-align: center;
        }
        .city-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(106, 13, 173, 0.6);
        }
        .city-name {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin: 0;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <a href="locations.html" class="navbar-brand">MovieBook</a>
    <div id="navRight"></div>
</nav>

<div class="container">
    <h1 class="page-title">Select Your City</h1>
    <p class="page-subtitle">Choose a city to see available theaters</p>
    
    <div class="row justify-content-center" id="cityList"></div>
</div>

<script src="script.js"></script>
<script>loadCities();</script>
</body>
</html>
